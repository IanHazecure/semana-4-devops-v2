services:
  db:
    image: mysql:8.0
    restart: unless-stopped
    environment:
      MYSQL_ROOT_PASSWORD: Password123
      MYSQL_DATABASE: my_database
      MYSQL_USER: mysqluser
      MYSQL_PASSWORD: Password123
    volumes:
      - ./db/init.sql:/docker-entrypoint-initdb.d/init.sql:ro
      - db_data:/var/lib/mysql
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost", "-u", "root", "-pPassword123"]
      interval: 10s
      timeout: 5s
      retries: 10

  api:
    image: ${ACR_LOGIN_SERVER}/${API_IMAGE_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    environment:
      DB_HOST: db
      DB_USER: mysqluser
      DB_PASSWORD: Password123
      DB_NAME: my_database
    depends_on:
      db:
        condition: service_healthy

  frontend:
    image: ${ACR_LOGIN_SERVER}/${IMAGE_REPO}:${IMAGE_TAG}
    restart: unless-stopped
    ports:
      - "${HOST_PORT}:80"
    environment:
      APP_ENV: ${APP_ENV}
      APP_VERSION: ${IMAGE_TAG}
    depends_on:
      - api

volumes:
  db_data:
