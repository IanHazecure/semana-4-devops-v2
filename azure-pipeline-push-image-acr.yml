trigger:
  branches:
    include:
      - main

pr: none

pool:
  vmImage: 'ubuntu-latest'

steps:

- checkout: self
  clean: true

# ===== FRONTEND (React + Nginx) =====
- task: Docker@2
  displayName: 'Build de imagen frontend (React + Nginx)'
  inputs:
    command: 'build'
    containerRegistry: 'sc-devops-v2'
    repository: '$(imageRepository)'
    Dockerfile: '$(Build.SourcesDirectory)/docker/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)/docker'
    tags: |
      $(Build.BuildId)
      latest

- bash: |
    set -Eeuo pipefail
    IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -F '/$(imageRepository):' | grep -E ':$(Build.BuildId)$' | head -n 1)
    [ -n "${IMAGE}" ] || { echo 'ERROR: no se encontró la imagen frontend.'; exit 1; }
    cleanup() { docker logs ci-smoke 2>&1 | tail -n 30 || true; docker rm -f ci-smoke >/dev/null 2>&1 || true; }
    trap cleanup EXIT
    docker run -d --name ci-smoke -e APP_ENV=ci -e APP_VERSION=build-$(Build.BuildId) -p 8081:80 "${IMAGE}"
    OK='false'
    for i in {1..15}; do curl -fsS http://127.0.0.1:8081/ >/dev/null 2>&1 && { OK='true'; break; }; sleep 2; done
    [ "${OK}" = 'true' ] || { echo 'ERROR: el frontend no respondió por HTTP.'; exit 1; }
    curl -fsS http://127.0.0.1:8081/ | grep -q 'id="root"'
    echo 'OK: prueba de humo del frontend superada.'
  displayName: 'Prueba de humo del frontend (CI)'

- task: Docker@2
  displayName: 'Push de imagen frontend a ACR'
  inputs:
    command: 'push'
    containerRegistry: 'sc-devops-v2'
    repository: '$(imageRepository)'
    tags: |
      $(Build.BuildId)
      latest

# ===== API (Node + Express) =====
- task: Docker@2
  displayName: 'Build de imagen API'
  inputs:
    command: 'build'
    containerRegistry: 'sc-devops-v2'
    repository: '$(apiImageRepository)'
    Dockerfile: '$(Build.SourcesDirectory)/api/Dockerfile'
    buildContext: '$(Build.SourcesDirectory)/api'
    tags: |
      $(Build.BuildId)
      latest

- bash: |
    set -Eeuo pipefail
    IMAGE=$(docker images --format '{{.Repository}}:{{.Tag}}' | grep -F '/$(apiImageRepository):' | grep -E ':$(Build.BuildId)$' | head -n 1)
    [ -n "${IMAGE}" ] || { echo 'ERROR: no se encontró la imagen de la API.'; exit 1; }
    cleanup() { docker logs ci-smoke-api 2>&1 | tail -n 30 || true; docker rm -f ci-smoke-api >/dev/null 2>&1 || true; }
    trap cleanup EXIT
    # Prueba sin MySQL real: solo valida que el proceso arranca y responde /api/health
    docker run -d --name ci-smoke-api -e DB_HOST=127.0.0.1 -p 8082:3001 "${IMAGE}"
    OK='false'
    for i in {1..10}; do curl -fsS http://127.0.0.1:8082/api/health >/dev/null 2>&1 && { OK='true'; break; }; sleep 2; done
    [ "${OK}" = 'true' ] || { echo 'ERROR: la API no respondió por HTTP.'; exit 1; }
    echo 'OK: prueba de humo de la API superada.'
  displayName: 'Prueba de humo de la API (CI)'

- task: Docker@2
  displayName: 'Push de imagen API a ACR'
  inputs:
    command: 'push'
    containerRegistry: 'sc-devops-v2'
    repository: '$(apiImageRepository)'
    tags: |
      $(Build.BuildId)
      latest

- bash: |
    echo '============================================================'
    echo ' BUILD, PRUEBAS Y PUSH FINALIZADOS CORRECTAMENTE'
    echo '============================================================'
    echo "Frontend: $(imageRepository):$(Build.BuildId)"
    echo "API     : $(apiImageRepository):$(Build.BuildId)"
    echo '============================================================'
  displayName: 'Resumen de imágenes publicadas'
